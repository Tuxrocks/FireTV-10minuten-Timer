<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10-Minuten-Dauertimer</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
main{text-align:center;width:100%;padding:3vw}
#time{font-size:clamp(6rem,27vw,24rem);font-weight:800;letter-spacing:-.06em;font-variant-numeric:tabular-nums;line-height:1}
#status{font-size:clamp(1rem,3vw,2rem);margin-top:4vh;color:#bbb}
#start{margin-top:4vh;font-size:clamp(1.1rem,3vw,2rem);padding:.6em 1.2em;border:2px solid #fff;border-radius:12px;background:#111;color:#fff}
#hint{font-size:clamp(.8rem,1.7vw,1.2rem);color:#777;margin-top:2vh}
</style>
</head>
<body>
<main>
  <div id="time">10:00</div>
  <div id="status">Bereit</div>
  <button id="start">START</button>
  <div id="hint">OK / Enter = Start oder Neustart · Vollbild nach Start</div>
</main>
<script>
let remaining=600, endAt=0, running=false, alarmTimer=null, interval=null, audioCtx=null;
const timeEl=document.getElementById('time'), statusEl=document.getElementById('status'), startBtn=document.getElementById('start');
function draw(){const m=Math.floor(remaining/60),s=remaining%60;timeEl.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function alarm(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const now=audioCtx.currentTime;
    // Originaler, kurzer, auf- und abschwellender Alarmton – keine Aufnahme.
    for(let i=0;i<8;i++){
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sawtooth';
      const t=now+i*.48;
      o.frequency.setValueAtTime(520,t);
      o.frequency.linearRampToValueAtTime(880,t+.22);
      o.frequency.linearRampToValueAtTime(520,t+.44);
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(.20,t+.04);
      g.gain.setValueAtTime(.20,t+.38);
      g.gain.linearRampToValueAtTime(.0001,t+.46);
      o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.48);
    }
  }catch(e){}
}
function start(){
  clearTimeout(alarmTimer); remaining=600; endAt=Date.now()+600000; running=true;
  statusEl.textContent='Läuft · nächster Alarm bei 00:00';startBtn.hidden=true;
  try{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.()}catch(e){}
  clearInterval(interval);
  interval=setInterval(()=>{
    remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));draw();
    if(remaining<=0){
      clearInterval(interval);running=false;statusEl.textContent='ALARM! Neuer Durchlauf startet …';
      alarm();
      alarmTimer=setTimeout(start,4500);
    }
  },200);
  draw();
}
startBtn.addEventListener('click',start);
document.addEventListener('keydown',e=>{
  if(['Enter',' ','OK','Select'].includes(e.key)){e.preventDefault();start()}
});
draw();
</script>
</body>
</html>
